model_list:

  # Main assistant conversation / email reasoning
  - model_name: smart-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # Intent / classification
  - model_name: classifier-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_2
      drop_params: true

  # Tool / action decision helper
  - model_name: tool-helper-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # Aggregation / synthesis
  - model_name: aggregator-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_2
      drop_params: true

  # Low-latency / task extraction
  - model_name: fast-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true


  # Fallback
  - model_name: local-chat
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_2
      drop_params: true

  # Optional embeddings
  - model_name: embed-cache
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434


# ============================================================
# GENERAL SETTINGS
# ============================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY


# ============================================================
# LITELLM SETTINGS
# ============================================================

litellm_settings:
  drop_params: true
  store_model_in_db: false

# ============================================================
# ROUTER SETTINGS
# ============================================================

router_settings:
  fallbacks:
    - smart-chat:
        - fast-chat
        - local-chat
    - local-chat:
        - smart-chat
    - fast-chat:
        - smart-chat
        - local-chat


# ============================================================
# TOKEN BUDGETS
# ============================================================

token_budgets:
  local-chat: 6000
  smart-chat: 6000
  classifier-chat: 6000
  fast-chat: 6000
  aggregator-chat: 4000
  tool-helper-chat: 6000
  default: 6000

  