server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------
    # Backend API
    # ---------------------------------------------------------
    location /sla/api/ {
        rewrite ^/sla/(.*)$ /$1 break;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sla;
    }

    # ---------------------------------------------------------
    # OAuth2 authorization
    # ---------------------------------------------------------
    location /sla/oauth2/ {
        rewrite ^/sla/(.*)$ /$1 break;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sla;
    }

    # ---------------------------------------------------------
    # OAuth2 callback ONLY.
    #
    # Must NOT be a prefix match on "/sla/login" - that would also
    # swallow the bare "/sla/login" and "/sla/login?error" requests
    # that Spring Security's oauth2Login() success/failure handlers
    # redirect the browser to. Those are meant to land back on the
    # React app (LoginGate), not on the backend, which has no page
    # for a bare GET /login and returns 404.
    # ---------------------------------------------------------
    location /sla/login/oauth2/code/ {
        rewrite ^/sla/(.*)$ /$1 break;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sla;
    }

    # ---------------------------------------------------------
    # Logout
    # ---------------------------------------------------------
    location /sla/logout {
        rewrite ^/sla/(.*)$ /$1 break;

        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sla;
    }

    # ---------------------------------------------------------
    # React application
    # ---------------------------------------------------------
    location = /sla {
        return 301 /sla/;
    }

    # index.html must not be cached.
    # This ensures a new deployment always gives the browser
    # the latest hashed JS/CSS asset references.
    location = /sla/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location /sla/ {
        try_files $uri $uri/ /sla/index.html;
    }
}